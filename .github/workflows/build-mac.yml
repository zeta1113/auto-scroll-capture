# macOS 빌드 — Apple Silicon(arm64) / Intel(x86_64) DMG 생성
# 최소 지원: macOS 12 Monterey (13 Ventura 이상 포함)
#  - v* 태그를 push 하면 자동 실행 → 그 태그의 릴리스(없으면 '초안' 생성)에 DMG 첨부
#    (Windows 설치 파일을 함께 올린 뒤 초안을 게시)
#  - main/mac 브랜치 push 시 빌드·점검만(아티팩트)
#  - Actions 탭에서 수동 실행(workflow_dispatch) 가능 (tag 입력 시 그 릴리스에 첨부)
name: macOS build

on:
  push:
    tags: ["v*"]
    branches: [main, mac]
    paths:
      - "source/**"
      - "tools/**"
      - "build_mac.sh"
      - ".github/workflows/build-mac.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "DMG 를 첨부할 릴리스 태그 (비우면 아티팩트만 생성)"
        required: false
        default: ""

permissions:
  contents: write

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release (if missing)
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists"
          else
            NOTES=".github/release-notes/$TAG.md"
            [ -f "$NOTES" ] || { echo "$TAG" > /tmp/notes.md; NOTES=/tmp/notes.md; }
            gh release create "$TAG" --draft --title "$TAG" --notes-file "$NOTES"
          fi

  build:
    name: macOS ${{ matrix.arch }}
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      PY_VER: "3.12.8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      # python.org 공식 universal2 빌드(macOS 10.13+ 호환, Tcl/Tk 포함)
      - name: Install Python ${{ env.PY_VER }} (python.org)
        run: |
          curl -fsSL -o py.pkg "https://www.python.org/ftp/python/${PY_VER}/python-${PY_VER}-macos11.pkg"
          sudo installer -pkg py.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # macOS 12 와 호환되는 휠만 내려받아 설치(러너 OS 용 최신 휠이 섞이지 않도록)
      - name: Install dependencies (macOS 12 compatible wheels)
        run: |
          python -m pip install -U pip
          python -m pip download --only-binary=:all: \
            --platform "macosx_12_0_${{ matrix.arch }}" \
            --python-version 3.12 --implementation cp \
            -d wheels -r source/requirements-mac.txt
          python -m pip install --no-index --find-links wheels -r source/requirements-mac.txt
          python -m pip install pyinstaller
          python -c "import tkinter, numpy, cv2, PIL, Quartz, AppKit, ApplicationServices; print('Tk', tkinter.TkVersion, '| numpy', numpy.__version__, '| cv2', cv2.__version__)"

      - name: Engine test (scroll capture on a test window)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          python tools/engine_test.py "engine_test_${{ matrix.arch }}.png" 2>&1 | tee engine_${{ matrix.arch }}.txt
          echo "::notice title=engine ${{ matrix.arch }}::$(grep -E 'result:|PASS|FAIL' engine_${{ matrix.arch }}.txt | tr '\n' ' ')"
          # [중지] → 여기까지 저장 / [취소] → 저장 안 함
          python tools/engine_test.py "engine_stop_${{ matrix.arch }}.png" --stop-after 12 2>&1 | tee engine_stop_${{ matrix.arch }}.txt
          echo "::notice title=engine-stop ${{ matrix.arch }}::$(grep -E 'result:|stopped|PASS|FAIL' engine_stop_${{ matrix.arch }}.txt | tr '\n' ' ')"
          python tools/engine_test.py "engine_cancel_${{ matrix.arch }}.png" --cancel-after 6 2>&1 | tee engine_cancel_${{ matrix.arch }}.txt
          echo "::notice title=engine-cancel ${{ matrix.arch }}::$(grep -E 'cancel|PASS|FAIL' engine_cancel_${{ matrix.arch }}.txt | tr '\n' ' ')"
          # 고정(sticky) 바가 중간부터 붙는 창 / 실제 Chrome 페이지 — 줄 표식으로 빠짐·중복 검사
          python tools/engine_test.py "engine_sticky_${{ matrix.arch }}.png" --sticky 2>&1 | tee engine_sticky_${{ matrix.arch }}.txt
          echo "::notice title=engine-sticky ${{ matrix.arch }}::$(grep -E 'pointer:|result:|lines:|PASS|FAIL' engine_sticky_${{ matrix.arch }}.txt | tr '\n' ' ')"
          python tools/engine_test.py "engine_chrome_${{ matrix.arch }}.png" --chrome 2>&1 | tee engine_chrome_${{ matrix.arch }}.txt
          echo "::notice title=engine-chrome ${{ matrix.arch }}::$(grep -E 'pointer:|result:|lines:|PASS|FAIL|SKIP|Error' engine_chrome_${{ matrix.arch }}.txt | tr '\n' ' ')"

      - name: Real page capture
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python tools/engine_test.py page_new_${{ matrix.arch }}.png --url https://github.com/jiwoochris/artex-global 2>&1 | tee page_new_${{ matrix.arch }}.txt
          echo "::notice title=page ${{ matrix.arch }}::$(grep -E 'region|pointer:|result:|DONE|Error' page_new_${{ matrix.arch }}.txt | tr '\n' ' ')"
      - name: Publish images
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_images.py ci-art-mac-${{ matrix.arch }} "page_*.png" "page_*.txt" "engine_*.png"

      - name: Build app + DMG
        run: |
          set +e
          PYTHON=python bash build_mac.sh > build_${{ matrix.arch }}.txt 2>&1
          st=$?
          cat build_${{ matrix.arch }}.txt
          if [ $st -ne 0 ]; then
            tail -n 25 build_${{ matrix.arch }}.txt | while IFS= read -r line; do echo "::error title=build ${{ matrix.arch }}::$line"; done
          fi
          exit $st

      - name: Check minimum macOS version (Monterey 12.0)
        run: |
          python tools/check_minos.py build/mac/dist/ScrollCapture.app 12.0 | tee minos.txt
          echo "::notice title=minos ${{ matrix.arch }}::$(head -1 minos.txt)"

      - name: Self-test bundled app
        timeout-minutes: 4
        run: |
          OUT="$PWD/selftest_${{ matrix.arch }}.txt"
          LOG="$PWD/selftest_log_${{ matrix.arch }}.txt"
          set +e
          SCROLLCAPTURE_SELFTEST="$OUT" perl -e 'alarm 150; exec @ARGV' \
            build/mac/dist/ScrollCapture.app/Contents/MacOS/ScrollCapture > "$LOG" 2>&1
          st=$?
          cat "$LOG"
          if [ $st -ne 0 ]; then
            echo "::error title=selftest ${{ matrix.arch }}::exit $st — last: $(grep -E '^(OK|FAIL|STEP|INFO)' "$OUT" | tail -n 3 | tr '\n' ' ')"
            grep -E 'File ".*(scroll_capture|platform_mac)|Fatal|Error|Current thread|Thread 0x' "$LOG" | head -n 8 | while IFS= read -r line; do echo "::error title=trace ${{ matrix.arch }}::$line"; done
          fi
          echo "::notice title=selftest ${{ matrix.arch }}::$(grep -c '^OK' "$OUT") OK, $(grep -c '^FAIL' "$OUT") FAIL — $(grep -E 'overlay|region_drag|esc|hotkey_fired' "$OUT" | tr '\n' ' ')"
          grep '^FAIL' "$OUT" | while IFS= read -r line; do echo "::error title=selftest ${{ matrix.arch }}::$line"; done || true
          exit $st

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ScrollCapture-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            selftest_*.txt
            engine_*.txt
            build_*.txt
            selftest_log_*.txt
            engine_test_*.png
          if-no-files-found: warn

      - name: Attach DMG to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/*.dmg --clobber

  # Windows 엔진 점검(빌드 없음): 깨끗한 Windows 서버에서 실제 입력으로 스크롤 캡처 검증
  windows-engine:
    name: Windows engine test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r source/requirements.txt
      - name: Engine tests (plain / sticky / Chrome)
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          for m in "" "--sticky" "--chrome"; do
            n="win${m//-/_}"
            python tools/engine_test.py "engine_${n}.png" $m 2>&1 | tee "engine_${n}.txt"
            echo "::notice title=engine ${n}::$(grep -E 'pointer:|result:|lines:|PASS|FAIL|SKIP|Error' "engine_${n}.txt" | tr '\n' ' ')"
          done
      - name: Real page capture (new vs v1.4.19)
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p old
          for f in scroll_capture.py version.py updater.py; do git show v1.4.19:source/$f > old/$f; done
          cp -r source/assets old/
          URL=https://github.com/jiwoochris/artex-global
          # 첫 Chrome 실행(첫 실행 안내 등) 영향을 없애려고 한 번 미리 실행
          SC_LOG=$PWD/page_warm_win_log.txt python tools/engine_test.py page_warm_win.png --url $URL 2>&1 | tee page_warm_win.txt
          python tools/engine_test.py page_old_win.png --url $URL --src old 2>&1 | tee page_old_win.txt
          SC_LOG=$PWD/page_new2_win_log.txt python tools/engine_test.py page_new2_win.png --url $URL 2>&1 | tee page_new2_win.txt
          echo "::notice title=page warm win::$(grep -E 'result:' page_warm_win.txt)"
          echo "::notice title=page new2 win::$(grep -E 'result:' page_new2_win.txt)"
          echo "::notice title=page new win::$(grep -E 'region|pointer:|result:|DONE|Error' page_new_win.txt | tr '\n' ' ')"
          echo "::notice title=page old win::$(grep -E 'region|pointer:|result:|DONE|Error' page_old_win.txt | tr '\n' ' ')"
      - name: Publish images
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_images.py ci-art-win "page_*.png" "page_*.txt" "engine_*.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-windows
          path: |
            engine_*.txt
            engine_*.png
          if-no-files-found: warn
