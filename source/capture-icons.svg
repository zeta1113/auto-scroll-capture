<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1904 360" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1a2f4a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 전체 배경: 흰색 -->
  <rect x="0" y="0" width="1904" height="360" fill="#FFFFFF"/>

  <!-- ===================== 카드 1: 디스플레이 스크롤 캡처 ===================== -->
  <g transform="translate(40,50)">
    <rect width="240" height="190" rx="22" fill="#F4F6F9" filter="url(#cardShadow)"/>
    <g transform="translate(120,95) scale(1.55)" stroke="#2C5F8A" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- 모니터 (참고 이미지와 동일: 화면 + 채워진 스탠드) -->
      <rect x="-42" y="-38" width="84" height="62" rx="13"/>
      <rect x="-8" y="23" width="16" height="12" fill="#2C5F8A" stroke="none"/>
      <rect x="-23" y="34" width="46" height="8" rx="4" fill="#2C5F8A" stroke="none"/>
      <!-- 스크롤 화살표(단순 직선 화살표) -->
      <path d="M 0,-24 L 0,10 M -9,0 L 0,10 L 9,0"/>
    </g>
    <text x="160" y="270" text-anchor="middle" font-size="26" fill="#222">디스플레이</text>
    <text x="160" y="304" text-anchor="middle" font-size="26" fill="#222">스크롤 캡처</text>
  </g>

  <!-- ===================== 카드 2: 윈도우 스크롤 캡처 ===================== -->
  <g transform="translate(304,50)">
    <rect width="240" height="190" rx="22" fill="#F4F6F9" filter="url(#cardShadow)"/>
    <g transform="translate(120,95) scale(1.55)" stroke="#2C5F8A" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- 브라우저 윈도우 -->
      <rect x="-45" y="-38" width="90" height="74" rx="11"/>
      <line x1="-45" y1="-17" x2="45" y2="-17"/>
      <circle cx="-36" cy="-27.5" r="2.4" fill="#2C5F8A" stroke="none"/>
      <circle cx="-27" cy="-27.5" r="2.4" fill="#2C5F8A" stroke="none"/>
      <circle cx="-18" cy="-27.5" r="2.4" fill="#2C5F8A" stroke="none"/>
      <!-- 스크롤 화살표(단순 직선 화살표) -->
      <path d="M 0,-1 L 0,27 M -9,17 L 0,27 L 9,17"/>
    </g>
    <text x="160" y="270" text-anchor="middle" font-size="26" fill="#222">윈도우</text>
    <text x="160" y="304" text-anchor="middle" font-size="26" fill="#222">스크롤 캡처</text>
  </g>

  <!-- ===================== 카드 3: 영역지정 스크롤 캡처 ===================== -->
  <g transform="translate(568,50)">
    <rect width="240" height="190" rx="22" fill="#F4F6F9" filter="url(#cardShadow)"/>
    <g transform="translate(120,95) scale(1.55)" stroke="#2C5F8A" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- 영역지정 (점선) -->
      <rect x="-41" y="-36" width="82" height="70" rx="11" stroke-dasharray="8,7"/>
      <!-- 스크롤 화살표(단순 직선 화살표) -->
      <path d="M 0,-20 L 0,14 M -9,4 L 0,14 L 9,4"/>
    </g>
    <text x="160" y="270" text-anchor="middle" font-size="26" fill="#222">영역지정</text>
    <text x="160" y="304" text-anchor="middle" font-size="26" fill="#222">스크롤 캡처</text>
  </g>

  <!-- ===================== 카드 4: 풀 디스플레이 캡처 (모니터 2개 겹침) ===================== -->
  <g transform="translate(832,50)">
    <rect width="240" height="190" rx="22" fill="#F4F6F9" filter="url(#cardShadow)"/>
    <g transform="translate(120,95) scale(1.55)" stroke="#2C5F8A" stroke-width="6.5" fill="#F4F6F9" stroke-linecap="round" stroke-linejoin="round">
      <!-- 뒤쪽 모니터 -->
      <g transform="translate(-15,-13)">
        <rect x="-38" y="-32" width="76" height="52" rx="11"/>
      </g>
      <!-- 앞쪽 모니터 (채워진 스탠드 포함) -->
      <g transform="translate(15,9)">
        <rect x="-38" y="-32" width="76" height="52" rx="11"/>
        <rect x="-7" y="20" width="14" height="10" fill="#2C5F8A" stroke="none"/>
        <rect x="-20" y="30" width="40" height="7" rx="3.5" fill="#2C5F8A" stroke="none"/>
      </g>
    </g>
    <text x="160" y="270" text-anchor="middle" font-size="26" fill="#222">풀 디스플레이</text>
    <text x="160" y="304" text-anchor="middle" font-size="26" fill="#222">캡처</text>
  </g>

  <!-- ===================== 카드 5: 디스플레이 캡처 ===================== -->
  <g transform="translate(1096,50)">
    <rect width="240" height="190" rx="22" fill="#F4F6F9" filter="url(#cardShadow)"/>
    <g transform="translate(120,95) scale(1.55)" stroke="#2C5F8A" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-42" y="-38" width="84" height="62" rx="13"/>
      <rect x="-8" y="23" width="16" height="12" fill="#2C5F8A" stroke="none"/>
      <rect x="-23" y="34" width="46" height="8" rx="4" fill="#2C5F8A" stroke="none"/>
    </g>
    <text x="160" y="270" text-anchor="middle" font-size="26" fill="#222">디스플레이</text>
    <text x="160" y="304" text-anchor="middle" font-size="26" fill="#222">캡처</text>
  </g>

  <!-- ===================== 카드 6: 윈도우 캡처 ===================== -->
  <g transform="translate(1360,50)">
    <rect width="240" height="190" rx="22" fill="#F4F6F9" filter="url(#cardShadow)"/>
    <g transform="translate(120,95) scale(1.55)" stroke="#2C5F8A" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-45" y="-38" width="90" height="74" rx="11"/>
      <line x1="-45" y1="-17" x2="45" y2="-17"/>
      <circle cx="-36" cy="-27.5" r="2.4" fill="#2C5F8A" stroke="none"/>
      <circle cx="-27" cy="-27.5" r="2.4" fill="#2C5F8A" stroke="none"/>
      <circle cx="-18" cy="-27.5" r="2.4" fill="#2C5F8A" stroke="none"/>
    </g>
    <text x="160" y="270" text-anchor="middle" font-size="26" fill="#222">윈도우 캡처</text>
  </g>

  <!-- ===================== 카드 7: 영역지정 캡처 ===================== -->
  <g transform="translate(1624,50)">
    <rect width="240" height="190" rx="22" fill="#F4F6F9" filter="url(#cardShadow)"/>
    <g transform="translate(120,95) scale(1.55)" stroke="#2C5F8A" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-41" y="-36" width="82" height="70" rx="11" stroke-dasharray="8,7"/>
    </g>
    <text x="160" y="270" text-anchor="middle" font-size="26" fill="#222">영역지정</text>
    <text x="160" y="304" text-anchor="middle" font-size="26" fill="#222">캡처</text>
  </g>

</svg>
